<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2027 東北滑雪・極致粉雪與冬奧入瀨秘境行</title>
  <style>
    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --primary-light: #e0f2fe;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-sub: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
      --gold: #fbbf24;
      --tag-restaurant: #f97316;
      --tag-dessert: #ec4899;
      --tag-beverage: #8b5cf6;
      --tag-souvenir: #10b981;
      --tag-shops: #d946ef;
      --tag-attractions: #06b6d4;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 60px;
    }

    header {
      background: linear-gradient(135deg, #0369a1 0%, #0f172a 100%);
      padding: 32px 20px 24px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }
    .container { max-width: 960px; margin: 0 auto; padding: 0 16px; }
    h1 { font-size: 1.85rem; font-weight: 800; margin-bottom: 8px; color: #fff; letter-spacing: -0.01em; }
    .subtitle { font-size: 0.95rem; color: var(--accent); margin-bottom: 16px; }

    /* 快捷導覽列 */
    .day-nav {
      display: flex; gap: 8px; overflow-x: auto; padding: 12px 0;
      position: sticky; top: 0; background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px); z-index: 100;
      border-bottom: 1px solid var(--border); scrollbar-width: none;
    }
    .day-nav::-webkit-scrollbar { display: none; }
    .day-nav-btn {
      flex: 0 0 auto; background: var(--card-bg); color: var(--text-muted);
      padding: 6px 14px; border-radius: 20px; font-size: 0.82rem;
      font-weight: 600; text-decoration: none; border: 1px solid var(--border);
      transition: all 0.2s ease;
    }
    .day-nav-btn:hover, .day-nav-btn:active { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* 班機卡片 */
    .flight-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0 6px; }
    @media (max-width: 640px) { .flight-grid { grid-template-columns: 1fr; } }
    .flight-card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; gap: 12px;
    }
    .flight-icon { font-size: 1.8rem; }
    .flight-details h4 { font-size: 0.92rem; color: #fff; margin-bottom: 4px; }
    .flight-details p { font-size: 0.8rem; color: var(--text-muted); }

    /* 雪場速覽區塊 */
    .resorts-bar {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px; margin: 20px 0 24px;
    }
    .resorts-bar h3 {
      font-size: 0.95rem; color: var(--accent); margin-bottom: 12px;
      display: flex; align-items: center; gap: 6px;
    }
    .resorts-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px;
    }
    .resort-btn-card {
      background: var(--card-sub); border-radius: 10px; padding: 12px 14px;
      display: flex; flex-direction: column; gap: 8px; border: 1px solid rgba(255,255,255,0.08);
    }
    .resort-name { font-size: 0.9rem; font-weight: 700; color: #fff; }
    .resort-elev { font-size: 0.78rem; color: var(--accent); }
    .resort-links { display: flex; gap: 6px; flex-wrap: wrap; }
    .resort-link {
      font-size: 0.72rem; padding: 4px 10px; border-radius: 6px; text-decoration: none;
      font-weight: 600; display: inline-block; transition: background 0.2s;
    }
    .link-forecast { background: rgba(56, 189, 248, 0.25); color: #38bdf8; border: 1px solid var(--primary); }
    .link-map { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
    .link-web { background: rgba(148, 163, 184, 0.15); color: #cbd5e1; border: 1px solid var(--border); }
    .link-forecast:hover, .link-map:hover, .link-web:hover { background: var(--primary); color: #fff; }

    /* 每日行程卡片 */
    .day-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px;
      margin-bottom: 24px; overflow: hidden; box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.3);
    }
    .day-header {
      background: linear-gradient(90deg, #1e293b 0%, #334155 100%);
      padding: 16px 20px; border-bottom: 1px solid var(--border);
      display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px;
    }
    .day-badge {
      background: var(--primary); color: #fff; font-size: 0.75rem; font-weight: 800;
      padding: 4px 10px; border-radius: 6px; text-transform: uppercase; margin-right: 8px;
    }
    .day-date { font-size: 0.88rem; font-weight: 600; color: var(--accent); }
    .day-title { font-size: 1.12rem; font-weight: 700; color: #fff; margin-top: 6px; width: 100%; }
    .day-body { padding: 18px 20px; }

    /* 住宿與按鈕 */
    .stay-box {
      background: rgba(15, 23, 42, 0.5); border: 1px solid rgba(51, 65, 85, 0.7);
      border-radius: 10px; padding: 10px 14px; margin-bottom: 16px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    }
    .stay-name { font-size: 0.92rem; font-weight: 600; color: #e2e8f0; }
    .map-btn {
      background: rgba(2, 132, 199, 0.2); color: var(--accent); border: 1px solid var(--primary);
      padding: 4px 12px; border-radius: 6px; font-size: 0.78rem; font-weight: 600; text-decoration: none;
      display: inline-flex; align-items: center; gap: 4px; transition: all 0.2s;
    }
    .map-btn:hover { background: var(--primary); color: #fff; }

    /* 滑雪場區塊 */
    .ski-banner {
      background: linear-gradient(135deg, rgba(2, 132, 199, 0.18) 0%, rgba(56, 189, 248, 0.06) 100%);
      border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px;
    }
    .ski-banner-title { font-size: 1rem; font-weight: 700; color: #fff; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .ski-banner-elev { font-size: 0.8rem; color: var(--accent); font-weight: 600; margin-bottom: 6px; }
    .ski-banner-desc { font-size: 0.82rem; color: #cbd5e1; line-height: 1.5; margin-bottom: 10px; }
    .ski-banner-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    
    .ski-toggle-map-btn {
      background: rgba(14, 165, 233, 0.25); color: #38bdf8; border: 1px solid var(--primary);
      padding: 6px 14px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px; transition: background 0.2s;
    }
    .ski-toggle-map-btn:hover { background: var(--primary); color: #fff; }

    .ski-map-preview-box {
      display: none; margin-top: 12px; padding: 12px;
      background: rgba(15, 23, 42, 0.9); border: 1px solid var(--border);
      border-radius: 8px; text-align: center;
    }
    .ski-map-img {
      max-width: 100%; height: auto; border-radius: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      display: block; margin: 0 auto;
    }
    .ski-map-caption {
      font-size: 0.76rem; color: var(--text-muted); margin-top: 6px;
    }

    /* 交通動線 */
    .transit-box { background: var(--card-sub); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
    .transit-summary { font-size: 0.88rem; font-weight: 700; color: #f1f5f9; margin-bottom: 10px; }
    .transit-timeline { list-style: none; position: relative; padding-left: 18px; }
    .transit-timeline::before {
      content: ''; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px; background: var(--primary); opacity: 0.6;
    }
    .transit-step { position: relative; font-size: 0.82rem; color: #cbd5e1; margin-bottom: 8px; line-height: 1.5; }
    .transit-step:last-child { margin-bottom: 0; }
    .transit-step::before {
      content: ''; position: absolute; left: -16px; top: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
    }

    /* Accordion 折疊規範 (5大子類別，每類滿額10項) */
    .recs-container { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 14px; }
    .recs-header-toggle { font-size: 0.92rem; font-weight: 700; color: #e2e8f0; margin-bottom: 10px; }
    .recs-sub-group { margin-bottom: 8px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: rgba(15, 23, 42, 0.4); }
    .sub-toggle {
      width: 100%; text-align: left; padding: 10px 14px; background: transparent; border: none;
      color: #e2e8f0; font-size: 0.85rem; font-weight: 600; cursor: pointer; display: flex;
      align-items: center; justify-content: space-between; transition: background 0.2s;
    }
    .sub-toggle:hover { background: rgba(255, 255, 255, 0.04); }
    .tag-badge { display: inline-block; font-size: 0.72rem; padding: 2px 6px; border-radius: 4px; margin-right: 6px; font-weight: 700; }
    .tag-restaurant { background: rgba(249, 115, 22, 0.2); color: #fb923c; }
    .tag-dessert { background: rgba(236, 72, 153, 0.2); color: #f472b6; }
    .tag-beverage { background: rgba(139, 92, 246, 0.2); color: #a78bfa; }
    .tag-souvenir { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .tag-shops { background: rgba(217, 70, 239, 0.2); color: #e879f9; }
    .tag-attractions { background: rgba(6, 182, 212, 0.2); color: #22d3ee; }
    .arrow { font-size: 0.72rem; color: var(--text-muted); transition: transform 0.2s ease; }
    .sub-toggle.active .arrow { transform: rotate(180deg); }
    .sub-content { display: none; padding: 10px 14px 14px; border-top: 1px solid var(--border); background: rgba(15, 23, 42, 0.25); }
    
    .rec-item { padding: 10px 0; border-bottom: 1px dashed rgba(51, 65, 85, 0.6); }
    .rec-item:last-child { border-bottom: none; }
    .rec-item-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
    .rec-title-wrap { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .rec-name { font-size: 0.88rem; font-weight: 700; color: #fff; }
    .rating-stars { color: var(--gold); font-size: 0.78rem; letter-spacing: 1px; font-weight: 700; }
    .dist-badge {
      background: rgba(148, 163, 184, 0.15); color: #94a3b8; font-size: 0.72rem; padding: 1px 6px; border-radius: 4px;
    }
    .rec-desc { font-size: 0.78rem; color: #cbd5e1; line-height: 1.45; }

    /* 應急備案卡片 */
    .contingency-section {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px;
      padding: 20px; margin-top: 28px;
    }
    .contingency-section h2 { font-size: 1.15rem; color: #fff; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .contingency-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
    .contingency-card {
      background: var(--card-sub); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 10px; padding: 14px 16px;
    }
    .contingency-card h4 { font-size: 0.95rem; color: var(--warning); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
    .contingency-scenario { font-size: 0.8rem; color: #fde68a; margin-bottom: 8px; font-weight: 600; }
    .contingency-actions { list-style: none; padding-left: 0; }
    .contingency-action-item { font-size: 0.78rem; color: #cbd5e1; margin-bottom: 6px; line-height: 1.45; position: relative; padding-left: 14px; }
    .contingency-action-item::before { content: '•'; position: absolute; left: 0; color: var(--warning); }

    footer { text-align: center; padding: 30px 20px 10px; font-size: 0.78rem; color: var(--text-muted); }
  </style>
</head>
<body>

  <header>
    <div class="container">
      <h1 id="trip-title">❄️ 2027 東北滑雪・極致粉雪與冬奧入瀨秘境行</h1>
      
      <div class="flight-grid" id="flight-container"></div>
    </div>
  </header>

  <div class="day-nav" id="day-nav"></div>

  <main class="container" style="margin-top: 20px;">
    
    <!-- 雪場速覽區塊 (含官方雪道圖截圖展開) -->
    <section class="resorts-bar" id="resorts-bar">
      <h3>⛷️ 本次行程 5 大滑雪場速覽與雪道地圖</h3>
      <div class="resorts-grid" id="resorts-grid"></div>
    </section>

    <!-- 16 日行程主容器 -->
    <div id="days-container">
      <div style="text-align: center; padding: 40px; color: var(--text-muted);">
        ⏳ 正在載入行程資料 (itinerary.json)...
      </div>
    </div>

    <!-- 4 大天候與交通應急備案 -->
    <section class="contingency-section" id="contingency-section">
      <h2>🛡️ 4 大天候暴風雪、降雪不足與交通延誤之動態替代應變方案</h2>
      <div class="contingency-grid" id="contingency-grid"></div>
    </section>

  </main>

  <footer>
    <p>2027 Japan Tohoku Ski Itinerary • Fully Automated Cloud Pipeline via Google Apps Script & GitHub Actions</p>
  </footer>

  <script>
    function toggleAccordion(btn) {
      const content = btn.nextElementSibling;
      const isOpen = content.style.display === 'block';
      content.style.display = isOpen ? 'none' : 'block';
      btn.classList.toggle('active', !isOpen);
    }

    function toggleMapPreview(btn) {
      const mapBox = btn.nextElementSibling;
      const isOpen = mapBox.style.display === 'block';
      mapBox.style.display = isOpen ? 'none' : 'block';
      btn.innerHTML = isOpen ? '🗺️ 檢視雪道地圖截圖 [▼ 點擊展開]' : '🗺️ 隱藏雪道地圖截圖 [▲ 點擊收合]';
    }

    async function loadItinerary() {
      try {
        const res = await fetch('./itinerary.json?v=' + Date.now());
        if (!res.ok) throw new Error('無法讀取 itinerary.json (HTTP ' + res.status + ')');
        const data = await res.json();
        renderPage(data);
      } catch (err) {
        console.error(err);
        document.getElementById('days-container').innerHTML = `
          <div style="background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; border-radius: 12px; padding: 20px; color: #fca5a5; text-align: center;">
            <h3>⚠️ 資料載入失敗</h3>
            <p style="margin-top: 8px; font-size: 0.85rem;">無法取得 itinerary.json，請確認檔案已同步至儲存庫根目錄。</p>
          </div>
        `;
      }
    }

    function renderPage(data) {
      if (data.trip_title) document.getElementById('trip-title').innerText = '❄️ ' + data.trip_title;

      const flightContainer = document.getElementById('flight-container');
      if (data.flights && data.flights.length > 0) {
        flightContainer.innerHTML = data.flights.map(f => `
          <div class="flight-card">
            <div class="flight-icon">${f.type === 'arrival' ? '🛫' : '🛬'}</div>
            <div class="flight-details">
              <h4>${f.airline} ${f.flight_number} (${f.date})</h4>
              <p>${f.departure.airport} ${f.departure.time} ➔ ${f.arrival.airport} ${f.arrival.time}</p>
            </div>
          </div>
        `).join('');
      }

      // 渲染雪場速覽
      const resortsGrid = document.getElementById('resorts-grid');
      if (data.ski_resorts_overview && data.ski_resorts_overview.length > 0) {
        resortsGrid.innerHTML = data.ski_resorts_overview.map(r => `
          <div class="resort-btn-card">
            <div class="resort-name">⛷️ ${r.name}</div>
            <div class="resort-elev">📍 標高：${r.elevation}</div>
            <div class="resort-links">
              <a href="${r.snow_forecast_url}" target="_blank" rel="noopener" class="resort-link link-forecast">❄️ 即時雪報</a>
              <a href="${r.official_website}" target="_blank" rel="noopener" class="resort-link link-web">🌐 官方網站</a>
              <a href="${r.course_map_url}" target="_blank" rel="noopener" class="resort-link link-map">🗺️ 官方雪道圖</a>
            </div>
            ${r.map_image_url ? `
              <button class="ski-toggle-map-btn" style="margin-top: 4px;" onclick="toggleMapPreview(this)">🗺️ 檢視雪道地圖截圖 [▼ 點擊展開]</button>
              <div class="ski-map-preview-box">
                <img src="${r.map_image_url}" alt="${r.name} 雪道全圖" class="ski-map-img" loading="eager" referrerpolicy="no-referrer" onerror="if(this.src!='https://surfsnow.jp/real_img/r0699/course_pic_r0699.jpg'){this.src='https://surfsnow.jp/real_img/r0699/course_pic_r0699.jpg';}" />
              <div class="ski-map-error-box" style="display:none !important; padding:10px; margin:8px 0; background:rgba(239,68,68,0.15); border:1px dashed #ef4444; border-radius:8px; text-align:center;">
                <p style="font-size:0.8rem; color:#fca5a5; margin-bottom:6px;">⚠️ 官方伺服器限制跨站圖片載入，請直接點擊下方連結：</p>
                <a href="${r.map_image_url}" target="_blank" rel="noopener" class="map-btn" style="background:#0284c7; color:#fff; font-weight:700;">🌐 在新分頁直接開啟官方原圖</a>
              </div>
              <div class="ski-map-caption" style="margin-top:6px; display:flex; gap:6px; justify-content:center; flex-wrap:wrap;">
                <a href="${r.map_image_url}" target="_blank" rel="noopener" class="map-btn" style="background:rgba(2,132,199,0.25); border-color:var(--accent); color:#38bdf8;">🖼️ 開啟官方原圖連結</a>
                <a href="${r.course_map_url}" target="_blank" rel="noopener" class="map-btn" style="background:rgba(148,163,184,0.15); border-color:var(--border); color:#cbd5e1;">🌐 官方雪道導覽頁</a>
              </div>
              </div>
            ` : ''}
          </div>
        `).join('');
      }

      const navContainer = document.getElementById('day-nav');
      const daysContainer = document.getElementById('days-container');
      navContainer.innerHTML = '';
      daysContainer.innerHTML = '';

      const categoryLabels = {
        restaurant: { name: '正餐名物', tagClass: 'tag-restaurant', icon: '🍱' },
        dessert_pastry: { name: '甜點糕點', tagClass: 'tag-dessert', icon: '🍰' },
        beverage: { name: '特色飲品・地酒', tagClass: 'tag-beverage', icon: '🍶' },
        souvenir: { name: '必買伴手禮', tagClass: 'tag-souvenir', icon: '🎁' },
        specialty_shops: { name: '必逛店家・生活選物', tagClass: 'tag-shops', icon: '🛍️' },
        attractions: { name: '必訪景點推薦', tagClass: 'tag-attractions', icon: '📍' }
      };

      data.days.forEach(day => {
        const navBtn = document.createElement('a');
        navBtn.href = `#day-${day.day_number}`;
        navBtn.className = 'day-nav-btn';
        navBtn.innerText = `D${day.day_number} (${day.date.slice(5)})`;
        navContainer.appendChild(navBtn);

        let skiHtml = '';
        if (day.ski_resort) {
          skiHtml = `
            <div class="ski-banner">
              <div class="ski-banner-title">⛷️ ${day.ski_resort.name}</div>
              <div class="ski-banner-elev">📍 標高：${day.ski_resort.elevation}</div>
              <div class="ski-banner-desc">${day.ski_resort.highlights}</div>
              <div class="ski-banner-actions">
                ${day.ski_resort.snow_forecast_url ? `<a href="${day.ski_resort.snow_forecast_url}" target="_blank" rel="noopener" class="map-btn" style="background: rgba(56, 189, 248, 0.25); border-color: var(--accent); color: #fff;">❄️ Snow-Forecast 即時雪報</a>` : ''}
                ${day.ski_resort.official_website ? `<a href="${day.ski_resort.official_website}" target="_blank" rel="noopener" class="map-btn" style="border-color: var(--border); color: #cbd5e1;">🌐 雪場官網</a>` : ''}
                ${day.ski_resort.course_map_url ? `<a href="${day.ski_resort.course_map_url}" target="_blank" rel="noopener" class="map-btn">🗺️ 官方全景雪道圖</a>` : ''}
              </div>
              ${day.ski_resort.map_image_url ? `
                <button class="ski-toggle-map-btn" onclick="toggleMapPreview(this)">🗺️ 檢視雪道地圖截圖 [▼ 點擊展開]</button>
                <div class="ski-map-preview-box">
                  <img src="${day.ski_resort.map_image_url}" alt="${day.ski_resort.name} 官方雪道圖" class="ski-map-img" loading="eager" referrerpolicy="no-referrer" onerror="if(this.src!='https://surfsnow.jp/real_img/r0699/course_pic_r0699.jpg'){this.src='https://surfsnow.jp/real_img/r0699/course_pic_r0699.jpg';}" />
                <div class="ski-map-error-box" style="display:none !important; padding:10px; margin:8px 0; background:rgba(239,68,68,0.15); border:1px dashed #ef4444; border-radius:8px; text-align:center;">
                  <p style="font-size:0.8rem; color:#fca5a5; margin-bottom:6px;">⚠️ 官方伺服器限制跨站圖片載入，請直接點擊下方連結：</p>
                  <a href="${day.ski_resort.map_image_url}" target="_blank" rel="noopener" class="map-btn" style="background:#0284c7; color:#fff; font-weight:700;">🌐 在新分頁直接開啟官方原圖</a>
                </div>
                <div class="ski-map-caption" style="margin-top:6px; display:flex; gap:6px; justify-content:center; flex-wrap:wrap;">
                  <a href="${day.ski_resort.map_image_url}" target="_blank" rel="noopener" class="map-btn" style="background:rgba(2,132,199,0.25); border-color:var(--accent); color:#38bdf8;">🖼️ 開啟官方原圖連結</a>
                  <a href="${day.ski_resort.course_map_url}" target="_blank" rel="noopener" class="map-btn" style="background:rgba(148,163,184,0.15); border-color:var(--border); color:#cbd5e1;">🌐 官方雪道導覽頁</a>
                </div>
                </div>
              ` : ''}
            </div>
          `;
        }

        let transitHtml = '';
        if (day.transit) {
          const stepsHtml = (day.transit.details || []).map(step => `<li class="transit-step">${step}</li>`).join('');
          transitHtml = `
            <div class="transit-box">
              <div class="transit-summary">🚊 交通動線：${day.transit.summary}</div>
              <ul class="transit-timeline">${stepsHtml}</ul>
            </div>
          `;
        }

        let recsHtml = '';
        if (day.recommendations) {
          let subGroups = '';
          for (const [catKey, catMeta] of Object.entries(categoryLabels)) {
            const items = day.recommendations[catKey] || [];
            if (items.length > 0) {
              const itemsList = items.map(item => `
                <div class="rec-item">
                  <div class="rec-item-header">
                    <div class="rec-title-wrap">
                      <span class="rec-name">${item.name}</span>
                      ${item.rating ? `<span class="rating-stars">${item.rating}</span>` : ''}
                      ${item.distance ? `<span class="dist-badge">${item.distance}</span>` : ''}
                    </div>
                    <a href="${item.map_url}" target="_blank" rel="noopener" class="map-btn">📍 Google 搜尋</a>
                  </div>
                  <div class="rec-desc">${item.highlights}</div>
                </div>
              `).join('');

              subGroups += `
                <div class="recs-sub-group">
                  <button class="sub-toggle" onclick="toggleAccordion(this)">
                    <span>
                      <span class="tag-badge ${catMeta.tagClass}">${catMeta.icon} ${catMeta.name}</span>
                      <small style="color: var(--text-muted);">(${items.length} 選)</small>
                    </span>
                    <span class="arrow">▼</span>
                  </button>
                  <div class="sub-content">${itemsList}</div>
                </div>
              `;
            }
          }

          if (subGroups) {
            recsHtml = `
              <div class="recs-container">
                <div class="recs-header-toggle">🍽️ 在地推薦名單（6 大子類別・每類 10 項滿額推薦・點選展開）</div>
                ${subGroups}
              </div>
            `;
          }
        }

        const cardHtml = `
          <article class="day-card" id="day-${day.day_number}">
            <div class="day-header">
              <div>
                <span class="day-badge">Day ${day.day_number}</span>
                <span class="day-date">${day.date}</span>
              </div>
              <h3 class="day-title">${day.day_title}</h3>
            </div>
            <div class="day-body">
              ${day.stay ? `
                <div class="stay-box">
                  <span class="stay-name">🏨 下榻：${day.stay}</span>
                  ${day.stay_map ? `<a href="${day.stay_map}" target="_blank" rel="noopener" class="map-btn">📍 飯店地圖</a>` : ''}
                </div>
              ` : ''}
              ${skiHtml}
              ${transitHtml}
              ${recsHtml}
            </div>
          </article>
        `;
        daysContainer.insertAdjacentHTML('beforeend', cardHtml);
      });

      // 渲染應急備案
      const contingencyGrid = document.getElementById('contingency-grid');
      if (data.contingency_plans && data.contingency_plans.length > 0) {
        contingencyGrid.innerHTML = data.contingency_plans.map(c => `
          <div class="contingency-card">
            <h4>${c.icon} ${c.title}</h4>
            <div class="contingency-scenario">⚠️ 觸發情境：${c.scenario}</div>
            <ul class="contingency-actions">
              ${c.actions.map(act => `<li class="contingency-action-item">${act}</li>`).join('')}
            </ul>
          </div>
        `).join('');
      }
    }

    document.addEventListener('DOMContentLoaded', loadItinerary);
  </script>
</body>
</html>
